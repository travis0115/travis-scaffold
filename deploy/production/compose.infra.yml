name: travis-infra

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USERNAME:?MYSQL_USERNAME is required}
      TZ: UTC
    volumes:
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/data/mysql:/var/lib/mysql
    networks: [travis-internal]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping --silent -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.2.15-bookworm
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/data/redis:/data
    networks: [travis-internal]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

networks:
  travis-internal:
    name: travis-internal
    external: true
