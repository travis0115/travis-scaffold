logging:
  access:
    enabled: true #是否启用access日志，true/false，默认开启
  level:
    root: info  #全局日志级别
  output: file  #日志输出方式 file/stdout
  file:
    path: /data/logs/${spring.application.name}/${HOSTNAME:local}
    name: application #不加.log后缀
    async:
      discarding-threshold: 0 #队列丢弃日志的阈值，使用率超过阈值，开始丢低优先级日志，WARN/ERROR不丢弃，设置为0表示队列满开始丢弃
      queue-size: 1024 #队列深度，该值会影响性能
      never-block: false #永不堵塞，开启时配合discarding-threshold值，达到阈值时丢弃日志，关闭则不丢弃日志，可能导致业务阻塞
  logback:
    rollingpolicy:
      max-history: 30 #日志文件的保留天数
      max-file-size: 10MB  #日志文件，到达多少容量，进行滚动
      total-size-cap: 5GB #日志文件的总大小上限，超出会自动删除旧文件
      clean-history-on-start: true  #启动时清理

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        enabled: false  # 是否启用 OTLP（OpenTelemetry Protocol）指标导出

rocketmq:
  # 消费者配置(全局默认配置)
  push-consumer:
    # 访问密钥(如果启用ACL)
    access-key: ${ROCKETMQ_CONSUMER_ACCESS_KEY}
    # 密钥(如果启用ACL)
    secret-key: ${ROCKETMQ_CONSUMER_SECRET_KEY}
    # 是否启用消息轨迹，本地开发可以关闭消息轨迹
    enable-msg-trace: true
    # Proxy 模式访问，端口为 Docker 映射的 8081
    endpoints: ${ROCKETMQ_CONSUMER_ENDPOINTS}

  # 生产者配置
  producer:
    # 访问密钥(如果启用ACL)
    access-key: ${ROCKETMQ_PRODUCER_ACCESS_KEY}
    # 密钥(如果启用ACL)
    secret-key: ${ROCKETMQ_PRODUCER_SECRET_KEY}
    # 是否启用消息轨迹，本地开发可以关闭消息轨迹
    enable-msg-trace: true
    # Proxy 模式访问，端口为 Docker 映射的 8081
    endpoints: ${ROCKETMQ_PRODUCER_ENDPOINTS}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    druid:
      stat-view-servlet:
        enabled: false
        reset-enable: false
      web-stat-filter:
        enabled: false
  modulith:
    runtime:
      verification-enabled: false #是否启用运行时验证，true/false

travis:
  rocketmq:
    # RocketMQ 客户端日志路径（v5 gRPC 客户端 + tools），受 rocketmq.log.root 系统属性控制
    client:
      log-path: /data/logs/rocketmq
    auto-initialize:
      enabled: true  # 启动时自动初始化不存在的 Topic 和消费者分组
      namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR}  # NameServer 地址（注意：不是 Proxy gRPC 端口），启用 auto-initialize 时必填
